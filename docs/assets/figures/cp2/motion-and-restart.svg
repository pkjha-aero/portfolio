   </g>
   <g id="text_10">
    <text style="fill: #212121; font: 8.2px 'DejaVu Sans'" transform="translate(377.181328 189.463291)">Saved and restored: flow state · mesh configuration</text>
    <text style="fill: #212121; font: 8.2px 'DejaVu Sans'" transform="translate(414.978203 198.645497)">· rigid-body state · motion history</text>
    <text style="fill: #212121; font: 8.2px 'DejaVu Sans'" transform="translate(411.113953 207.827704)">(user DOFs mapped to mesh DOFs)</text>
    <text style="fill: #212121; font: 8.2px 'DejaVu Sans'" transform="translate(415.955797 217.00991)">· consistent, appendable log files</text>
   </g>
