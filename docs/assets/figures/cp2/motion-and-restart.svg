   <g id="text_1">
    <text style="font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="17.064" y="27.704348" transform="rotate(-0 17.064 27.704348)">Two motion modes</text>
   </g>
   <g id="text_2">
    <text style="font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="342.792" y="27.704348" transform="rotate(-0 342.792 27.704348)">Restart of a coupled run</text>
   </g>
   <g id="text_3">
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(58.675977 81.105589)">Forced motion</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(47.363008 90.62373)">α(t) = α₀ + A sin ωt</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(61.966406 100.14187)">(verification)</text>
   </g>
   <g id="text_4">
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(220.450352 81.105589)">Free motion</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(214.839688 90.62373)">loads ⇄ 6-DOF</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(225.560977 100.14187)">(coupled)</text>
   </g>
   <g id="text_5">
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(85.865078 190.450867)">Flow advance and mesh advance kept</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(78.887773 199.969007)">separate, so each mode stays consistent;</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(102.868398 209.487148)">coupled steps sub-iterate with</text>
    <text style="fill: #212121; font: 8.5px 'DejaVu Sans'" transform="translate(75.258008 219.005288)">Aitken relaxation until fluid and body agree</text>
   </g>
   <g id="text_6">
    <text style="fill: #283593; font: 7.5px 'DejaVu Sans'; text-anchor: middle" x="399.168" y="75.6" transform="rotate(-0 399.168 75.6)">checkpoint 1</text>
   </g>
   <g id="text_7">
    <text style="fill: #283593; font: 7.5px 'DejaVu Sans'; text-anchor: middle" x="486.864" y="75.6" transform="rotate(-0 486.864 75.6)">checkpoint 2</text>
   </g>
   <g id="text_8">
    <text style="fill: #283593; font: 7.5px 'DejaVu Sans'; text-anchor: middle" x="574.56" y="75.6" transform="rotate(-0 574.56 75.6)">checkpoint 3</text>
